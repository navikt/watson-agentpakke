name: Update base agentpakke

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-base-agentpakke
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install nav-pilot
        run: |
          set -euo pipefail
          go install github.com/navikt/copilot/cli/nav-pilot@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Select pull request branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="chore/update-base-agentpakke"
          git fetch origin "$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch -c "$branch" --track "origin/$branch"
            git rebase "origin/$BASE_BRANCH"
          else
            git switch -c "$branch"
          fi

      - name: Bump base
        run: |
          set -euo pipefail
          nav-pilot pakke bump-base --target "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/base-agentpakke-diff.md"

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="chore/update-base-agentpakke"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Lockfila er allerede oppdatert"
            exit 0
          fi

          git add .nav-pilot/agentpakke.lock.json
          git commit -m "chore: bump base agentpakke"
          git push --force-with-lease origin "$branch"

          title="chore: bump base agentpakke"
          body="$(cat "$RUNNER_TEMP/base-agentpakke-diff.md")"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --base "$BASE_BRANCH" --title "$title" --body "$body"
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$title" --body "$body"
          fi
